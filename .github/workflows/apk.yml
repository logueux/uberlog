name: APK Android
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Préparer
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Clé de signature
        working-directory: app/android/app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > uberlog.keystore
            echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            echo "::add-mask::$P"
            keytool -genkeypair -keystore uberlog.keystore -alias uberlog -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=UBERLOG"
            echo "KEY_PASS=$P" >> "$GITHUB_ENV"
          fi
      - name: Compiler
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../uberlog.apk
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk uberlog.apk --title "UBERLOG Android (build ${{ github.run_number }})" --notes "Télécharger uberlog.apk et l'installer sur le téléphone Android." --latest
